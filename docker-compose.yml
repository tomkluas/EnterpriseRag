version: '3.9'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - bge_cache:/root/.cache/huggingface
      - ./models:/models:ro
    env_file:
      - .env
    environment:
      BGE_MODEL_PATH: /models/bge-m3
      BGE_RERANKER_PATH: /models/bge-reranker-v2-m3
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    depends_on:
      - qdrant
    restart: always

  qdrant:
    image: qdrant/qdrant:v1.9.3
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

volumes:
  qdrant_data:
  bge_cache:
