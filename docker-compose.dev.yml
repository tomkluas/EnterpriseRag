version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - bge_cache:/root/.cache/huggingface
      - ./models:/models:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/rag_system.db
      - BGE_MODEL_PATH=/models/bge-m3
      - BGE_RERANKER_PATH=/models/bge-reranker-v2-m3
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.9.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  bge_cache:
